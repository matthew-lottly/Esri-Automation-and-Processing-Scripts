name: ci
on: [push, pull_request]
jobs:
  gas-electric-leak-response:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/gas-electric-leak-response
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: products/gas-electric-leak-response/requirements-dev.txt
      - name: System libraries for the WeasyPrint PDF engine
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-liberation
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=src python -m pytest -q
      - name: README diagrams are up to date
        run: PYTHONPATH=src python -m gas_electric_response flowchart --check
      - name: Offline demo runs end to end
        run: PYTHONPATH=src python -m gas_electric_response demo --out ./demo_output
      - name: Report templates render
        run: |
          PYTHONPATH=src python -m gas_electric_response preview templates/field_ticket.html --out /tmp/a.pdf
          PYTHONPATH=src python -m gas_electric_response preview templates/risk_assessment.html --out /tmp/b.pdf
