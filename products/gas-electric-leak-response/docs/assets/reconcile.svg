<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1864 320" width="1864" height="320" role="img" aria-label="Daily reconciliation"><title>Daily reconciliation</title><desc>Weekdays 17:00 local  →  audit layers and drives  →  executive briefing</desc><style>
        .bg{fill:url(#bg)} .grid{fill:url(#dots)}
        text{font-family:Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;}
        .title{font-size:27px;font-weight:700;fill:#F4F7FB;letter-spacing:.2px}
        .sub{font-size:14px;fill:#8FA3BD}
        .card{fill:#16233A;stroke-width:1.4}
        .name{font-size:12.6px;font-weight:600;fill:#EAF1FA}
        .chip-t{font-size:10.5px;fill:#9FB4CF}
        .badge-t{font-size:11px;font-weight:700;fill:#0B1220}
        .gh{font-size:11.5px;font-weight:700;letter-spacing:1.4px}
        .edge{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:3 7;animation:flow 1.1s linear infinite;opacity:.85}
        .rail{fill:none;stroke:#22324D;stroke-width:5;stroke-linecap:round}
        .reject{fill:none;stroke:#FF6B7F;stroke-width:1.6;stroke-dasharray:4 5;animation:flow 1.6s linear infinite}
        .legend-t{font-size:11.5px;fill:#9FB4CF}
        @keyframes flow{to{stroke-dashoffset:-20}}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
        .float{animation:float 4.5s ease-in-out infinite}
        @media (prefers-reduced-motion: reduce){.edge,.reject,.float{animation:none}}
        </style><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A1020"/><stop offset="1" stop-color="#101B33"/></linearGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#1B2A45"/></pattern>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".35"/></filter>
</defs><rect class="bg" width="1864" height="320" rx="22"/><rect class="grid" width="1864" height="320" rx="22" opacity=".7"/><text class="title" x="44" y="58">Daily reconciliation</text><text class="sub" x="44" y="84">Weekdays 17:00 local  →  audit layers and drives  →  executive briefing</text><path id="main" class="rail" d="M194.0,184.0 L223.0,184.0 Q234.0,184.0 245.0,184.0 L419.0,184.0 Q430.0,184.0 441.0,184.0 L459.0,184.0 Q470.0,184.0 481.0,184.0 L655.0,184.0 Q666.0,184.0 677.0,184.0 L695.0,184.0 Q706.0,184.0 717.0,184.0 L891.0,184.0 Q902.0,184.0 913.0,184.0 L931.0,184.0 Q942.0,184.0 953.0,184.0 L1127.0,184.0 Q1138.0,184.0 1149.0,184.0 L1167.0,184.0 Q1178.0,184.0 1189.0,184.0 L1363.0,184.0 Q1374.0,184.0 1385.0,184.0 L1403.0,184.0 Q1414.0,184.0 1425.0,184.0 L1599.0,184.0 Q1610.0,184.0 1621.0,184.0 L1650.0,184.0"/><path class="edge" stroke="#FFFFFF" d="M194.0,184.0 L234.0,184.0"/><path class="edge" stroke="#4DA3FF" d="M430.0,184.0 L470.0,184.0"/><path class="edge" stroke="#2EE6C5" d="M666.0,184.0 L706.0,184.0"/><path class="edge" stroke="#B28DFF" d="M902.0,184.0 L942.0,184.0"/><path class="edge" stroke="#FFC145" d="M1138.0,184.0 L1178.0,184.0"/><path class="edge" stroke="#5BE584" d="M1374.0,184.0 L1414.0,184.0"/><path class="edge" stroke="#FF7A90" d="M1610.0,184.0 L1650.0,184.0"/><g class="float" filter="url(#soft)"><rect class="card" x="44" y="138" width="150" height="92" rx="16" stroke="#FFFFFF" stroke-opacity=".5"/><circle cx="76" cy="172" r="17" fill="none" stroke="#EAF1FA" stroke-width="1.8"/><path d="M76,161 v11 l8,5" stroke="#4DA3FF" stroke-width="2" fill="none" stroke-linecap="round"/><text class="name" x="60" y="206">Scheduler 17:00</text><text class="chip-t" x="60" y="221">weekdays • local time</text></g><g filter="url(#soft)"><rect class="card" x="234" y="150" width="196" height="68" rx="14" stroke="#4DA3FF" stroke-opacity=".55"/></g><rect x="231" y="147" width="202" height="74" rx="16" fill="none" stroke="#4DA3FF" stroke-width="2.4" opacity="0" filter="url(#glow)"><animate attributeName="opacity" dur="6.00s" begin="0.49s" repeatCount="indefinite" keyTimes="0;0.05;0.3;1" values="0;1;0;0"/></rect><circle cx="255" cy="171" r="11.5" fill="#4DA3FF"/><text class="badge-t" x="255" y="175" text-anchor="middle">1</text><text class="name" x="274" y="182">Query incident layer</text><text class="chip-t" x="244" y="236">records processed since the</text><text class="chip-t" x="244" y="250">previous run (rolling window;</text><text class="chip-t" x="244" y="264">weekends and after-hours included)</text><g filter="url(#soft)"><rect class="card" x="470" y="150" width="196" height="68" rx="14" stroke="#2EE6C5" stroke-opacity=".55"/></g><rect x="467" y="147" width="202" height="74" rx="16" fill="none" stroke="#2EE6C5" stroke-width="2.4" opacity="0" filter="url(#glow)"><animate attributeName="opacity" dur="6.00s" begin="3.41s" repeatCount="indefinite" keyTimes="0;0.05;0.3;1" values="0;1;0;0"/></rect><circle cx="491" cy="171" r="11.5" fill="#2EE6C5"/><text class="badge-t" x="491" y="175" text-anchor="middle">2</text><text class="name" x="510" y="182">Query survey layer</text><text class="chip-t" x="480" y="236">count raw field submissions in the</text><text class="chip-t" x="480" y="250">same window</text><g filter="url(#soft)"><rect class="card" x="706" y="150" width="196" height="68" rx="14" stroke="#B28DFF" stroke-opacity=".55"/></g><rect x="703" y="147" width="202" height="74" rx="16" fill="none" stroke="#B28DFF" stroke-width="2.4" opacity="0" filter="url(#glow)"><animate attributeName="opacity" dur="6.00s" begin="0.33s" repeatCount="indefinite" keyTimes="0;0.05;0.3;1" values="0;1;0;0"/></rect><circle cx="727" cy="171" r="11.5" fill="#B28DFF"/><text class="badge-t" x="727" y="175" text-anchor="middle">3</text><text class="name" x="746" y="177">Verify shared drives</text><text class="name" x="746" y="192">A and B</text><text class="chip-t" x="716" y="236">check every recorded PDF exists;</text><text class="chip-t" x="716" y="250">tally PDFs written today</text><g filter="url(#soft)"><rect class="card" x="942" y="150" width="196" height="68" rx="14" stroke="#FFC145" stroke-opacity=".55"/></g><rect x="939" y="147" width="202" height="74" rx="16" fill="none" stroke="#FFC145" stroke-width="2.4" opacity="0" filter="url(#glow)"><animate attributeName="opacity" dur="6.00s" begin="3.25s" repeatCount="indefinite" keyTimes="0;0.05;0.3;1" values="0;1;0;0"/></rect><circle cx="963" cy="171" r="11.5" fill="#FFC145"/><text class="badge-t" x="963" y="175" text-anchor="middle">4</text><text class="name" x="982" y="182">Compile metrics</text><text class="chip-t" x="952" y="236">totals, grade breakdown, joint-</text><text class="chip-t" x="952" y="250">utility hazards, rejections</text><g filter="url(#soft)"><rect class="card" x="1178" y="150" width="196" height="68" rx="14" stroke="#5BE584" stroke-opacity=".55"/></g><rect x="1175" y="147" width="202" height="74" rx="16" fill="none" stroke="#5BE584" stroke-width="2.4" opacity="0" filter="url(#glow)"><animate attributeName="opacity" dur="6.00s" begin="0.16s" repeatCount="indefinite" keyTimes="0;0.05;0.3;1" values="0;1;0;0"/></rect><circle cx="1199" cy="171" r="11.5" fill="#5BE584"/><text class="badge-t" x="1199" y="175" text-anchor="middle">5</text><text class="name" x="1218" y="182">Detect discrepancies</text><text class="chip-t" x="1188" y="236">feature created but report</text><text class="chip-t" x="1188" y="250">missing/failed, submissions with</text><text class="chip-t" x="1188" y="264">no feature, failed e-mails</text><g filter="url(#soft)"><rect class="card" x="1414" y="150" width="196" height="68" rx="14" stroke="#FF7A90" stroke-opacity=".55"/></g><rect x="1411" y="147" width="202" height="74" rx="16" fill="none" stroke="#FF7A90" stroke-width="2.4" opacity="0" filter="url(#glow)"><animate attributeName="opacity" dur="6.00s" begin="3.08s" repeatCount="indefinite" keyTimes="0;0.05;0.3;1" values="0;1;0;0"/></rect><circle cx="1435" cy="171" r="11.5" fill="#FF7A90"/><text class="badge-t" x="1435" y="175" text-anchor="middle">6</text><text class="name" x="1454" y="177">Send executive</text><text class="name" x="1454" y="192">summary</text><text class="chip-t" x="1424" y="236">Director of Gas Ops, Chief Safety</text><text class="chip-t" x="1424" y="250">Officer, GIS Systems Administrator</text><g class="float" filter="url(#soft)"><rect class="card" x="1650" y="144" width="170" height="80" rx="14" stroke="#5BE584" stroke-opacity=".6"/><text class="name" x="1664" y="176">Executive summary</text><text class="chip-t" x="1664" y="196">Director • CSO • GIS admin</text></g><g filter="url(#glow)"><circle r="5.2" fill="#FFFFFF"><animateMotion dur="18.0s" begin="-0.00s" repeatCount="indefinite" rotate="auto"><mpath href="#main"/></animateMotion></circle></g><circle r="9" fill="#FFFFFF" opacity=".18"><animateMotion dur="18.0s" begin="-0.00s" repeatCount="indefinite"><mpath href="#main"/></animateMotion></circle><g filter="url(#glow)"><circle r="5.2" fill="#FFFFFF"><animateMotion dur="18.0s" begin="-6.00s" repeatCount="indefinite" rotate="auto"><mpath href="#main"/></animateMotion></circle></g><circle r="9" fill="#FFFFFF" opacity=".18"><animateMotion dur="18.0s" begin="-6.00s" repeatCount="indefinite"><mpath href="#main"/></animateMotion></circle><g filter="url(#glow)"><circle r="5.2" fill="#FFFFFF"><animateMotion dur="18.0s" begin="-12.00s" repeatCount="indefinite" rotate="auto"><mpath href="#main"/></animateMotion></circle></g><circle r="9" fill="#FFFFFF" opacity=".18"><animateMotion dur="18.0s" begin="-12.00s" repeatCount="indefinite"><mpath href="#main"/></animateMotion></circle></svg>