{# Alert e-mail for Grade 1-2 incidents. Inline CSS only (e-mail clients ignore <style> blocks). Same {{ placeholders }} as the PDF templates. #}
<!doctype html>
<html><body style="margin:0;padding:0;background:#EEF1F4;font-family:Helvetica,Arial,sans-serif;color:#14202B">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#EEF1F4;padding:18px 0"><tr><td align="center">
  <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #E3E8EE">
    <tr><td style="background:{{ grade.color }};color:#ffffff;padding:18px 24px">
      <div style="font-size:11px;letter-spacing:1.2px;text-transform:uppercase;opacity:.9">Gas / Electric joint hazard{% if escalation %} &middot; ESCALATION{% endif %}</div>
      <div style="font-size:24px;font-weight:700;margin-top:4px">{{ grade.title }}</div>
      <div style="font-size:13px;margin-top:4px">{{ report.leak_id }} &nbsp;&bull;&nbsp; {{ report.anchor }}</div>
    </td></tr>
    <tr><td style="padding:20px 24px">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>
        {% for label, value in [("Peak reading", (report.effective_lel_pct | fmt('.1f')) ~ " % LEL"), ("Electric assets", counts.electric_total), ("Critical facilities", counts.facilities), ("Nearest valve", (nearest_valve.id ~ " (" ~ (nearest_valve.distance_m | fmt('.0f')) ~ " m)"))] %}
        <td style="padding:0 6px 0 0;vertical-align:top"><div style="background:#F6F8FA;border:1px solid #E3E8EE;border-radius:6px;padding:9px 11px">
          <div style="font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:#5F6C7B">{{ label }}</div>
          <div style="font-size:16px;font-weight:700;margin-top:2px">{{ value }}</div></div></td>
        {% endfor %}
      </tr></table>
      <p style="font-size:13px;line-height:1.5;margin:16px 0 4px"><strong>Dispatch:</strong> {{ grade.dispatch }}</p>
      <p style="font-size:13px;line-height:1.5;margin:0 0 4px"><strong>Why:</strong> {{ grade.reasons }}</p>
      {% if flags %}<p style="font-size:12px;line-height:1.5;margin:8px 0 0;color:#B45309"><strong>Notes:</strong> {{ flags }}</p>{% endif %}
      <p style="font-size:12px;color:#5F6C7B;margin:16px 0 0">The Ignition &amp; Hazard Assessment PDF is attached.</p>
    </td></tr>
    <tr><td style="background:#F6F8FA;border-top:1px solid #E3E8EE;padding:12px 24px;font-size:11px;color:#5F6C7B">
      Screening-level automation output - confirm with the field crew and operations. Generated {{ generated.local }}.
    </td></tr>
  </table>
</td></tr></table>
</body></html>
